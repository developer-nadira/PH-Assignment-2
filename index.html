<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave Header</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#100822] font-['Inter']">

    <!-- Header -->
    <header class="h-[92px] border-b border-violet-500/30">

        <!-- Header content -->
        <div class="h-full flex items-center justify-between px-12">

            <!-- Logo -->
            <h1 class="text-[27px] font-extrabold">
                <span class="text-white">Tech</span><span class="text-fuchsia-500">Wave</span>
            </h1>

            <!-- Navigation menu -->
            <nav class="flex items-center gap-10">

                <a href="#" class="text-sm text-gray-300 hover:text-fuchsia-400">
                    About
                </a>

                <a href="#" class="text-sm text-gray-300 hover:text-fuchsia-400">
                    Episodes
                </a>

                <a href="#" class="text-sm text-gray-300 hover:text-fuchsia-400">
                    Host
                </a>

            </nav>

            <!-- Subscribe button -->
            <a href="#"
               class="rounded-full bg-gradient-to-r from-yellow-300 via-pink-500 to-fuchsia-600 px-5 py-2.5 text-sm font-semibold text-white">
                Subscribe →
            </a>

        </div>

    </header>

</body>
</html>
